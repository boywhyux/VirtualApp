name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'AppConfig.gradle'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install CMake and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;25.2.9519653"
      - name: Set up Gradle 7.3.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.3.3'
      - name: Set up JDK 11 for Gradle build
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
